services:
  # --------------------------------------------------------------------------
  # 1. OmniDrive Full-Stack Web Service (Fastify API + React Frontend)
  # --------------------------------------------------------------------------
  - type: web
    name: omnidrive-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run prisma:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERVE_STATIC
        value: "true"
      - key: IN_PROCESS_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: omnidrive-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_SCOPES
        value: "https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile openid"
      - key: ENABLE_DEMO_ACCOUNTS
        value: "true"

databases:
  # --------------------------------------------------------------------------
  # Render PostgreSQL Database
  # --------------------------------------------------------------------------
  - name: omnidrive-postgres
    plan: free
    region: oregon
    databaseName: omnidrive
    user: omnidrive_user
