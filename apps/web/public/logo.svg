<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Cyan glow gradient -->
    <linearGradient id="cyanRing" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Violet/Magenta glow gradient -->
    <linearGradient id="violetRing" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Indigo core gradient -->
    <linearGradient id="indigoRing" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- High-intensity neon glow filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="centerAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Soft Radial Core -->
  <circle cx="60" cy="60" r="50" fill="url(#centerAtmosphere)" />

  <!-- Tri-Loop Interconnected Structure -->
  <g filter="url(#neonGlow)" stroke-width="7" stroke-linecap="round" fill="none">
    <!-- Top-Right Loop (Cyan) -->
    <ellipse cx="60" cy="46" rx="26" ry="34" transform="rotate(-15 60 46)" stroke="url(#cyanRing)" opacity="0.95" />
    
    <!-- Bottom-Left Loop (Indigo) -->
    <ellipse cx="48" cy="68" rx="25" ry="32" transform="rotate(45 48 68)" stroke="url(#indigoRing)" opacity="0.9" />

    <!-- Bottom-Right Loop (Violet) -->
    <ellipse cx="72" cy="68" rx="25" ry="32" transform="rotate(-45 72 68)" stroke="url(#violetRing)" opacity="0.95" />
  </g>

  <!-- Specular highlight accents -->
  <path d="M52 26 C 60 20, 68 22, 74 30" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="drop-shadow(0 0 3px #38BDF8)" />
  <path d="M86 64 C 92 72, 88 84, 78 88" stroke="#F3E8FF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" filter="drop-shadow(0 0 3px #C084FC)" />
  <path d="M30 68 C 28 58, 36 48, 46 42" stroke="#EEF2FF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" filter="drop-shadow(0 0 3px #818CF8)" />

  <!-- Center Convergence Core -->
  <circle cx="60" cy="60" r="4.5" fill="#FFFFFF" filter="drop-shadow(0 0 6px #818CF8)" />
</svg>
