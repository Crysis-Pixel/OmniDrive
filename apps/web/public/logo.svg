<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="omniGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="omniAccent" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#omniGrad)" />
  <circle cx="24" cy="24" r="14" stroke="white" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.4" />
  <!-- Three connected cloud drives orbit -->
  <circle cx="24" cy="14" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="15.5" cy="29" r="4.5" fill="#A855F7" filter="url(#glow)" />
  <circle cx="32.5" cy="29" r="4.5" fill="#34D399" filter="url(#glow)" />
  <!-- Center hub -->
  <path d="M20 24L28 24M24 20L24 28" stroke="white" stroke-width="2.5" stroke-linecap="round" />
</svg>
